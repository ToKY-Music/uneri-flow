<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UNERI Flow - Emergent Particle Audio & Life Loop</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d0f18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* UI Panel Style & Collapse Logic */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #e0f0ff;
      pointer-events: auto;
      text-shadow: 0 0 8px rgba(0,255,200,0.5);
      background: rgba(13, 15, 24, 0.82);
      padding: 16px 18px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(126, 241, 211, 0.25);
      width: 260px;
      max-height: 85vh;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 折りたたみ状態 */
    #ui-container.collapsed {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 24px;
      background: rgba(13, 15, 24, 0.9);
      border-color: rgba(126, 241, 211, 0.6);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(126, 241, 211, 0.3);
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      color: #7ef1d3;
      white-space: nowrap;
    }

    .concept-sub {
      margin: 0 0 12px 0;
      font-size: 0.7rem;
      color: #90c8b8;
      line-height: 1.35;
      letter-spacing: 0.02em;
      opacity: 0.9;
    }

    /* 畳み込みボタンアイコン */
    .toggle-btn {
      background: rgba(126, 241, 211, 0.12);
      border: 1px solid rgba(126, 241, 211, 0.3);
      color: #7ef1d3;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-btn:hover {
      background: rgba(126, 241, 211, 0.3);
      transform: scale(1.08);
    }

    /* 折りたたまれた時に表示されるボタン用アイコン */
    .collapsed-icon {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #7ef1d3;
      animation: pulse-border 2s infinite;
      border-radius: 50%;
    }

    #ui-container.collapsed .ui-content,
    #ui-container.collapsed .ui-header {
      display: none;
    }

    #ui-container.collapsed .collapsed-icon {
      display: flex;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(126, 241, 211, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(126, 241, 211, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 241, 211, 0); }
    }

    .control-group {
      margin-bottom: 8px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #a0e0d0;
      margin-bottom: 2px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #7ef1d3;
      cursor: pointer;
    }
    hr {
      border: 0;
      border-top: 1px solid rgba(126, 241, 211, 0.2);
      margin: 10px 0;
    }
  </style>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <!-- 折畳み時の単独ボタン -->
    <div class="collapsed-icon" title="メニューを開く">⚙️</div>

    <!-- 通常展開時の表示要素 -->
    <div class="ui-header">
      <h1>UNERI Flow</h1>
      <div class="toggle-btn" id="toggle-btn" title="メニューを折りたたむ">─</div>
    </div>
    
    <!-- ④ さりげないコンセプト文言 -->
    <p class="concept-sub">衝突、進化、崩壊。<br>粒子の生態系を『持続』させる調和を見つけ出そう。</p>

    <div class="ui-content">
      <div class="control-group">
        <label>
          <span>指数減衰 (距離の影響度)</span>
          <span id="exp-val">2.2</span>
        </label>
        <input type="range" id="exp-slider" min="1.0" max="3.5" step="0.1" value="2.2">
      </div>

      <div class="control-group">
        <label>
          <span>閾値ブレーキ (孤立判定)</span>
          <span id="thresh-val">0.0010</span>
        </label>
        <input type="range" id="thresh-slider" min="0.0000" max="0.0050" step="0.0002" value="0.0010">
      </div>

      <hr>

      <div class="control-group">
        <label>
          <span>新粒子の発生しやすさ</span>
          <span id="react-val">1.0</span>
        </label>
        <input type="range" id="react-slider" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>
          <span>新粒子の分解時間</span>
          <span id="decay-val">1.0</span>
        </label>
        <input type="range" id="decay-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>
          <span>大きさ閾値 (限界サイズ)</span>
          <span id="size-val">1.20</span>
        </label>
        <input type="range" id="size-slider" min="0.5" max="2.5" step="0.05" value="1.20">
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 0. スライダー・UI制御
    // ==========================================
    let expFactor = 2.2;
    let thresholdValue = 0.0010;
    let reactivityFactor = 1.0; 
    let decayTimeFactor = 1.0;  
    let sizeLimitThreshold = 1.20; 

    const uiContainer = document.getElementById('ui-container');
    const toggleBtn = document.getElementById('toggle-btn');

    // ② UIの折りたたみトグル処理
    function toggleUI(e) {
      if (e) e.stopPropagation();
      uiContainer.classList.toggle('collapsed');
    }

    toggleBtn.addEventListener('click', toggleUI);
    uiContainer.addEventListener('click', (e) => {
      if (uiContainer.classList.contains('collapsed')) {
        toggleUI(e);
      }
    });

    const expSlider = document.getElementById('exp-slider');
    const expValDisplay = document.getElementById('exp-val');
    const threshSlider = document.getElementById('thresh-slider');
    const threshValDisplay = document.getElementById('thresh-val');

    const reactSlider = document.getElementById('react-slider');
    const reactValDisplay = document.getElementById('react-val');
    const decaySlider = document.getElementById('decay-slider');
    const decayValDisplay = document.getElementById('decay-val');
    const sizeSlider = document.getElementById('size-slider');
    const sizeValDisplay = document.getElementById('size-val');

    expSlider.addEventListener('input', (e) => {
      expFactor = parseFloat(e.target.value);
      expValDisplay.textContent = expFactor.toFixed(1);
    });

    threshSlider.addEventListener('input', (e) => {
      thresholdValue = parseFloat(e.target.value);
      threshValDisplay.textContent = thresholdValue.toFixed(4);
    });

    reactSlider.addEventListener('input', (e) => {
      reactivityFactor = parseFloat(e.target.value);
      reactValDisplay.textContent = reactivityFactor.toFixed(1);
    });

    decaySlider.addEventListener('input', (e) => {
      decayTimeFactor = parseFloat(e.target.value);
      decayValDisplay.textContent = decayTimeFactor.toFixed(1);
    });

    sizeSlider.addEventListener('input', (e) => {
      sizeLimitThreshold = parseFloat(e.target.value);
      sizeValDisplay.textContent = sizeLimitThreshold.toFixed(2);
    });

    // ==========================================
    // 1. 【③修正】Web Audio API 軽量ボイスプール構造
    // ==========================================
    let audioCtx = null;
    let masterFilter = null;
    const MAX_VOICES = 8; // 最大8音同時に制限してノイズ・無音化を完全防護
    const voicePool = [];

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          
          masterFilter = audioCtx.createBiquadFilter();
          masterFilter.type = 'lowpass';
          masterFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
          masterFilter.connect(audioCtx.destination);

          // 固定ボイスの初期化
          for (let i = 0; i < MAX_VOICES; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(masterFilter);
            osc.start();

            voicePool.push({ osc, gain, inUse: false });
          }
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 短いヒット音（衝突・融合用）
    function playPokoSound(pitchRatio = 1.0) {
      if (!audioCtx || audioCtx.state !== 'running') return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const baseFreq = 260 + Math.random() * 200;
        osc.frequency.setValueAtTime(baseFreq * pitchRatio, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.6 * pitchRatio, audioCtx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(masterFilter || audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch (e) {}
    }

    // ==========================================
    // 2. Three.js セットアップ
    // ==========================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d0f18, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    let targetZoom = 30;
    camera.position.set(0, 0, targetZoom);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const mainLight = new THREE.PointLight(0x7ef1d3, 2.5, 100);
    mainLight.position.set(0, 0, 20);
    scene.add(mainLight);

    const raycaster = new THREE.Raycaster();
    const mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const pointer = new THREE.Vector2();
    const intersectPoint = new THREE.Vector3();

    // ==========================================
    // 3. 粒子モデル
    // ==========================================
    const MAX_PARTICLES = 1000;
    const particles = [];

    const baseSphereGeo = new THREE.SphereGeometry(0.28, 12, 12);
    const particleMat = new THREE.MeshPhongMaterial({
      color: 0x7ef1d3,
      emissive: 0x052218,
      shininess: 90,
      transparent: true,
      opacity: 0.85
    });

    class ChibiParticle {
      constructor(x, y, z, initialVel, options = {}) {
        this.mesh = new THREE.Mesh(baseSphereGeo, particleMat.clone());
        this.mesh.position.set(x, y, z);
        
        this.type = options.type !== undefined ? options.type : 0;
        
        const rawRadius = options.radius !== undefined ? options.radius : 0.28;
        this.radius = Math.min(rawRadius, 3.0); 

        this.hue = options.hue !== undefined ? options.hue : (0.40 + Math.random() * 0.18);
        this.attractionPower = options.attractionPower !== undefined ? Math.min(options.attractionPower, 0.05) : 0.007;
        this.lifeBonus = options.lifeBonus !== undefined ? Math.min(options.lifeBonus, 3.0) : 1.0;
        
        this.mesh.scale.setScalar(this.radius / 0.28);
        this.mesh.material.color.setHSL(this.hue % 1.0, 0.8, 0.65);

        this.velocity = initialVel.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.12,
          (Math.random() - 0.5) * 0.12,
          (Math.random() - 0.5) * 0.04
        ));

        this.life = 1.0;
        this.baseDecay = (0.025 + Math.random() * 0.005) / this.lifeBonus;

        this.age = 0;
        this.decomposed = false;
        this.fusionCooldown = options.fusionCooldown !== undefined ? options.fusionCooldown : 30;

        this.baseFreq = (80 + Math.random() * 120) * Math.pow(0.9, Math.min(this.type, 8));
      }

      applyFlockingRule(neighbors, bounds) {
        const cohesion = new THREE.Vector3();
        const separation = new THREE.Vector3();
        const alignment = new THREE.Vector3();
        let count = 0;

        for (let i = 0; i < neighbors.length; i++) {
          const other = neighbors[i];
          const dist = this.mesh.position.distanceTo(other.mesh.position);

          if (dist > 0 && dist < 5.0) {
            cohesion.add(other.mesh.position);
            alignment.add(other.velocity);

            if (dist < (1.1 * (this.radius + other.radius) / 0.56)) {
              const pushAway = new THREE.Vector3().subVectors(this.mesh.position, other.mesh.position);
              pushAway.normalize().divideScalar(Math.max(dist, 0.1));
              separation.add(pushAway);
            }
            count++;
          }
        }

        if (count > 0) {
          cohesion.divideScalar(count);
          const cohesionForce = new THREE.Vector3().subVectors(cohesion, this.mesh.position).multiplyScalar(this.attractionPower);
          this.velocity.add(cohesionForce);

          alignment.divideScalar(count).multiplyScalar(0.035);
          this.velocity.add(alignment);

          separation.multiplyScalar(0.035);
          this.velocity.add(separation);
        }

        const marginX = bounds.x;
        const marginY = bounds.y;

        if (Math.abs(this.mesh.position.x) > marginX) {
          const pushCenter = -Math.sign(this.mesh.position.x) * 0.012 * (Math.abs(this.mesh.position.x) - marginX);
          this.velocity.x += pushCenter;
        }
        if (Math.abs(this.mesh.position.y) > marginY) {
          const pushCenter = -Math.sign(this.mesh.position.y) * 0.012 * (Math.abs(this.mesh.position.y) - marginY);
          this.velocity.y += pushCenter;
        }
      }

      update(allParticles) {
        this.velocity.multiplyScalar(0.965);
        this.mesh.position.add(this.velocity);
        this.age += 1;

        if (this.fusionCooldown > 0) {
          this.fusionCooldown--;
        }

        // --- 分解判定（合体粒子 type > 0）---
        if (this.type > 0) {
          let baseDecomposeAge = (200 + this.type * 80) * decayTimeFactor;
          
          if (this.radius > sizeLimitThreshold) {
            const overScale = this.radius / sizeLimitThreshold;
            baseDecomposeAge /= Math.max(1.1, Math.pow(overScale, 2));
          }

          if (this.age > baseDecomposeAge) {
            this.decomposed = true;
            return false;
          }

          // 【①修正】合体粒子は「消滅（死）」せず、分解を待つ（不滅の生態系）
          this.mesh.material.opacity = 0.9;
          return true; 
        }

        // --- 初期粒子 (type == 0) のみの寿命判定 ---
        let proximitySupport = 0;
        const totalCount = allParticles.length;

        for (let i = 0; i < totalCount; i++) {
          const other = allParticles[i];
          if (other !== this) {
            const dist = this.mesh.position.distanceTo(other.mesh.position);
            const exponentialDist = 1.0 / Math.pow(dist + 0.1, expFactor);
            proximitySupport += exponentialDist * 0.0035;
          }
        }

        let totalSupport = 0;
        if (proximitySupport > thresholdValue) {
          const countSupport = Math.pow(totalCount, 1.1) * 0.00003;
          totalSupport = proximitySupport + countSupport;
        }

        const currentDecay = Math.max(0.0003, this.baseDecay - totalSupport);
        this.life -= currentDecay;
        this.mesh.material.opacity = Math.max(0, this.life * 0.85);

        return this.life > 0;
      }

      destroy() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.mesh.material.dispose();
      }
    }

    // ==========================================
    // 4. 操作・生成処理
    // ==========================================
    let isInteracting = false;
    let lastPos = new THREE.Vector3();
    let dragVelocity = new THREE.Vector3();
    let initialPinchDistance = null;

    function getPointerPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      raycaster.ray.intersectPlane(mousePlane, intersectPoint);
    }

    function getTouchDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function onPointerDown(e) {
      if (e.target.closest('#ui-container')) return;
      initAudio();

      if (e.touches && e.touches.length === 2) {
        isInteracting = false;
        initialPinchDistance = getTouchDistance(e);
        return;
      }

      isInteracting = true;
      getPointerPos(e);
      lastPos.copy(intersectPoint);
      dragVelocity.set(0, 0, 0);

      spawnCluster(intersectPoint, 4, new THREE.Vector3());
    }

    function onPointerMove(e) {
      if (e.touches && e.touches.length === 2) {
        if (initialPinchDistance) {
          const newDistance = getTouchDistance(e);
          const factor = (initialPinchDistance - newDistance) * 0.08;
          targetZoom = Math.max(10, Math.min(80, targetZoom + factor));
          initialPinchDistance = newDistance;
        }
        return;
      }

      if (!isInteracting) return;
      getPointerPos(e);

      dragVelocity.subVectors(intersectPoint, lastPos);

      if (dragVelocity.lengthSq() > 0.04) {
        const count = Math.min(Math.floor(dragVelocity.length() * 4) + 1, 5);
        spawnCluster(intersectPoint, count, dragVelocity.clone().multiplyScalar(0.3));
        lastPos.copy(intersectPoint);
      }
    }

    function onPointerUp(e) {
      if (e.touches && e.touches.length < 2) {
        initialPinchDistance = null;
      }
      if (!e.touches || e.touches.length === 0) {
        isInteracting = false;
      }
    }

    window.addEventListener('wheel', (e) => {
      if (e.target.closest('#ui-container')) return;
      initAudio();
      targetZoom += e.deltaY * 0.03;
      targetZoom = Math.max(10, Math.min(80, targetZoom));
    }, { passive: true });

    function spawnCluster(pos, count, impulse, options = {}) {
      for (let i = 0; i < count; i++) {
        if (particles.length >= MAX_PARTICLES) {
          const oldest = particles.shift();
          oldest.destroy();
        }

        const offset = new THREE.Vector3(
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 0.3
        );
        const spawnPos = pos.clone().add(offset);
        const p = new ChibiParticle(spawnPos.x, spawnPos.y, spawnPos.z, impulse, options);

        scene.add(p.mesh);
        particles.push(p);
      }
      
      const speedPitch = 0.85 + Math.min(impulse.length() * 1.2, 0.7);
      playPokoSound(speedPitch);
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#ui-container')) return;
      initAudio();
      if (e.touches.length === 2) initialPinchDistance = getTouchDistance(e);
    }, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 5. 衝突判定・融合・構造生成ロジック
    // ==========================================
    function handleCollisionsAndFusion() {
      if (reactivityFactor <= 0.01) return;

      const requiredSpeed = 0.8 / reactivityFactor; 

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        if (!p1 || p1.life <= 0 || p1.fusionCooldown > 0) continue;

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          if (!p2 || p2.life <= 0 || p2.fusionCooldown > 0) continue;

          const dist = p1.mesh.position.distanceTo(p2.mesh.position);
          const minDist = (p1.radius + p2.radius) * 0.8; 

          if (dist < minDist) {
            const relVel = new THREE.Vector3().subVectors(p1.velocity, p2.velocity);
            const relativeSpeed = relVel.length();

            if (relativeSpeed > requiredSpeed) {
              p1.life = 0;
              p2.life = 0;

              const newType = Math.max(p1.type, p2.type) + 1;
              const maxLifeBonus = Math.min(Math.max(p1.lifeBonus, p2.lifeBonus) * 1.15, 2.5);
              const maxRadius = Math.min(Math.max(p1.radius, p2.radius) * 1.1, 2.5);
              const maxAttraction = Math.min(Math.max(p1.attractionPower, p2.attractionPower) * 1.2, 0.04);

              const latestHue = (p1.type >= p2.type) ? p1.hue : p2.hue;
              const newHue = latestHue + 0.05;

              const fusionPos = new THREE.Vector3().addVectors(p1.mesh.position, p2.mesh.position).multiplyScalar(0.5);
              const fusionVel = new THREE.Vector3().addVectors(p1.velocity, p2.velocity).multiplyScalar(0.5);

              playPokoSound(1.2 + Math.min(newType, 10) * 0.1);

              spawnCluster(fusionPos, 1, fusionVel, {
                type: newType,
                radius: maxRadius,
                hue: newHue,
                attractionPower: maxAttraction,
                lifeBonus: maxLifeBonus,
                fusionCooldown: 30
              });

              break;
            }
          }
        }
      }
    }

    // Dynamic Sound Voice Dispatcher (軽量サウンド管理)
    function updateAudioVoices() {
      if (!audioCtx || audioCtx.state !== 'running') return;

      // 速度上位の粒子を選択
      const activeParticles = particles
        .slice()
        .sort((a, b) => b.velocity.lengthSq() - a.velocity.lengthSq())
        .slice(0, MAX_VOICES);

      for (let i = 0; i < MAX_VOICES; i++) {
        const voice = voicePool[i];
        const p = activeParticles[i];

        if (p && p.life > 0) {
          const speed = p.velocity.length();
          const targetFreq = p.baseFreq + (speed * 300);
          const targetVol = Math.min(0.0003 + (speed * 0.005), 0.003) * Math.max(0, p.life);

          voice.osc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
          voice.gain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.08);
        } else {
          voice.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
        }
      }
    }

    // ==========================================
    // 6. メイン計算ループ
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      camera.position.z += (targetZoom - camera.position.z) * 0.1;

      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const bounds = { x: (visibleWidth / 2) * 0.82, y: (visibleHeight / 2) * 0.82 };

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const neighbors = [];
        for (let j = 0; j < particles.length; j += 2) { 
          if (i !== j) neighbors.push(particles[j]);
        }
        p.applyFlockingRule(neighbors, bounds);
      }

      handleCollisionsAndFusion();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const alive = p.update(particles);

        // 【①修正】合体粒子の分解（分解による自発的循環）
        if (p.decomposed) {
          const parentPos = p.mesh.position.clone();
          const parentVel = p.velocity.clone();
          const prevType = p.type - 1;

          p.destroy();
          particles.splice(i, 1);

          spawnCluster(parentPos, 2, parentVel.negate().multiplyScalar(0.25), {
            type: prevType,
            radius: Math.max(0.28, p.radius / 1.12),
            hue: p.hue,
            attractionPower: Math.max(0.007, p.attractionPower / 1.2),
            lifeBonus: Math.max(1.0, p.lifeBonus / 1.15),
            fusionCooldown: 40
          });
          continue;
        }

        if (!alive) {
          p.destroy();
          particles.splice(i, 1);
        }
      }

      // 軽量音響の同期更新
      updateAudioVoices();

      if (particles.length > 0) {
        const avgPos = new THREE.Vector3();
        for (let i = 0; i < particles.length; i++) {
          avgPos.add(particles[i].mesh.position);
        }
        avgPos.divideScalar(particles.length);
        mainLight.position.lerp(avgPos, 0.05);
        mainLight.position.z = camera.position.z * 0.6;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
