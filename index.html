<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UNERI Flow - Emergent Particle Audio & Life Loop</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d0f18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* UI Panel Style & Collapse Logic */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #e0f0ff;
      pointer-events: auto;
      text-shadow: 0 0 8px rgba(0,255,200,0.5);
      background: rgba(13, 15, 24, 0.88);
      padding: 16px 18px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(126, 241, 211, 0.25);
      width: 270px;
      max-height: 80vh;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), padding 0.3s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    /* 折りたたみ状態 */
    #ui-container.collapsed {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 24px;
      background: rgba(13, 15, 24, 0.9);
      border-color: rgba(126, 241, 211, 0.6);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(126, 241, 211, 0.3);
      overflow: hidden;
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .ui-header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      color: #7ef1d3;
      white-space: nowrap;
    }

    .concept-sub {
      margin: 0 0 10px 0;
      font-size: 0.68rem;
      color: #90c8b8;
      line-height: 1.35;
      letter-spacing: 0.02em;
      opacity: 0.85;
      flex-shrink: 0;
    }

    /* ボタン群 */
    .icon-btn {
      background: rgba(126, 241, 211, 0.12);
      border: 1px solid rgba(126, 241, 211, 0.3);
      color: #7ef1d3;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(126, 241, 211, 0.3);
      transform: scale(1.08);
    }

    .collapsed-icon {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #7ef1d3;
      animation: pulse-border 2s infinite;
      border-radius: 50%;
    }

    #ui-container.collapsed .ui-scrollable-content,
    #ui-container.collapsed .ui-header,
    #ui-container.collapsed .concept-sub,
    #ui-container.collapsed .section-title {
      display: none;
    }

    #ui-container.collapsed .collapsed-icon {
      display: flex;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(126, 241, 211, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(126, 241, 211, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 241, 211, 0); }
    }

    /* スクロール可能なUI領域 */
    .ui-scrollable-content {
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      margin-right: -4px;
    }

    .ui-scrollable-content::-webkit-scrollbar {
      width: 4px;
    }
    .ui-scrollable-content::-webkit-scrollbar-thumb {
      background: rgba(126, 241, 211, 0.3);
      border-radius: 2px;
    }

    .section-title {
      font-size: 0.65rem;
      font-weight: bold;
      color: #7ef1d3;
      letter-spacing: 0.12em;
      margin: 10px 0 6px 0;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(126, 241, 211, 0.2);
      text-transform: uppercase;
    }

    .control-group {
      margin-bottom: 8px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #a0e0d0;
      margin-bottom: 2px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #7ef1d3;
      cursor: pointer;
      height: 4px;
    }

    /* スイッチ用スタイル */
    .switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.7rem;
      color: #a0e0d0;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 18px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-round {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 18px;
      border: 1px solid rgba(126, 241, 211, 0.4);
    }
    .slider-round:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #7ef1d3;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider-round {
      background-color: rgba(126, 241, 211, 0.4);
    }
    input:checked + .slider-round:before {
      transform: translateX(18px);
      background-color: #ffffff;
    }
  </style>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <!-- 折畳み時のアイコン -->
    <div class="collapsed-icon" title="メニューを開く">⚙️</div>

    <!-- ヘッダー領域 -->
    <div class="ui-header">
      <h1>UNERI Flow</h1>
      <div class="ui-header-actions">
        <!-- ② リセット視点ボタン -->
        <div class="icon-btn" id="reset-cam-btn" title="視点を最初に戻す">🏠</div>
        <!-- トグルボタン -->
        <div class="icon-btn" id="toggle-btn" title="メニューを折りたたむ">─</div>
      </div>
    </div>
    
    <p class="concept-sub">衝突、進化、崩壊。<br>粒子の生態系を『持続』させる調和を見つけ出そう。</p>

    <!-- ③ 整理されたメニューエリア -->
    <div class="ui-scrollable-content">
      
      <!-- 生態系設定 -->
      <div class="section-title">Ecosystem Settings</div>

      <div class="control-group">
        <label>
          <span>指数減衰 (距離の影響度)</span>
          <span id="exp-val">2.2</span>
        </label>
        <input type="range" id="exp-slider" min="1.0" max="3.5" step="0.1" value="2.2">
      </div>

      <div class="control-group">
        <label>
          <span>閾値ブレーキ (孤立判定)</span>
          <span id="thresh-val">0.0010</span>
        </label>
        <input type="range" id="thresh-slider" min="0.0000" max="0.0050" step="0.0002" value="0.0010">
      </div>

      <div class="control-group">
        <label>
          <span>新粒子の発生しやすさ</span>
          <span id="react-val">1.0</span>
        </label>
        <input type="range" id="react-slider" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>
          <span>新粒子の分解時間</span>
          <span id="decay-val">1.0</span>
        </label>
        <input type="range" id="decay-slider" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>
          <span>大きさ閾値 (限界サイズ)</span>
          <span id="size-val">1.20</span>
        </label>
        <input type="range" id="size-slider" min="0.5" max="2.5" step="0.05" value="1.20">
      </div>

      <!-- 音響設定（追加機能） -->
      <div class="section-title">Audio Control</div>

      <div class="switch-group">
        <span>マスター音声 (Sound ON/OFF)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="audio-enable" checked>
          <span class="slider-round"></span>
        </label>
      </div>

      <div class="control-group">
        <label>
          <span>粒子発生音 (Spawn Volume)</span>
          <span id="vol-spawn-val">1.0</span>
        </label>
        <input type="range" id="vol-spawn-slider" min="0.0" max="2.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>
          <span>粒子移動音 (Motion Volume)</span>
          <span id="vol-motion-val">1.0</span>
        </label>
        <input type="range" id="vol-motion-slider" min="0.0" max="2.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>
          <span>粒子融合/分解音 (Fusion Volume)</span>
          <span id="vol-fusion-val">1.0</span>
        </label>
        <input type="range" id="vol-fusion-slider" min="0.0" max="2.0" step="0.1" value="1.0">
      </div>

    </div>
  </div>

  <script>
    // ==========================================
    // 0. スライダー・UI・音響制御変数
    // ==========================================
    let expFactor = 2.2;
    let thresholdValue = 0.0010;
    let reactivityFactor = 1.0; 
    let decayTimeFactor = 1.0;  
    let sizeLimitThreshold = 1.20; 

    // ③ 音量設定変数
    let isAudioEnabled = true;
    let volSpawn = 1.0;
    let volMotion = 1.0;
    let volFusion = 1.0;

    const uiContainer = document.getElementById('ui-container');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetCamBtn = document.getElementById('reset-cam-btn');

    function toggleUI(e) {
      if (e) e.stopPropagation();
      uiContainer.classList.toggle('collapsed');
    }

    toggleBtn.addEventListener('click', toggleUI);
    uiContainer.addEventListener('click', (e) => {
      if (uiContainer.classList.contains('collapsed')) {
        toggleUI(e);
      }
    });

    // スライダー・バインド
    const bindSlider = (sliderId, displayId, callback) => {
      const slider = document.getElementById(sliderId);
      const display = document.getElementById(displayId);
      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        display.textContent = val.toFixed(1);
        callback(val);
      });
    };

    bindSlider('exp-slider', 'exp-val', v => expFactor = v);
    
    document.getElementById('thresh-slider').addEventListener('input', (e) => {
      thresholdValue = parseFloat(e.target.value);
      document.getElementById('thresh-val').textContent = thresholdValue.toFixed(4);
    });

    bindSlider('react-slider', 'react-val', v => reactivityFactor = v);
    bindSlider('decay-slider', 'decay-val', v => decayTimeFactor = v);
    
    document.getElementById('size-slider').addEventListener('input', (e) => {
      sizeLimitThreshold = parseFloat(e.target.value);
      document.getElementById('size-val').textContent = sizeLimitThreshold.toFixed(2);
    });

    // 音響制御バインド
    document.getElementById('audio-enable').addEventListener('change', (e) => {
      isAudioEnabled = e.target.checked;
      if (audioCtx) {
        if (isAudioEnabled) audioCtx.resume();
        else audioCtx.suspend();
      }
    });

    bindSlider('vol-spawn-slider', 'vol-spawn-val', v => volSpawn = v);
    bindSlider('vol-motion-slider', 'vol-motion-val', v => volMotion = v);
    bindSlider('vol-fusion-slider', 'vol-fusion-val', v => volFusion = v);

    // ==========================================
    // 1. Web Audio API ボイスプール
    // ==========================================
    let audioCtx = null;
    let masterFilter = null;
    const MAX_VOICES = 8;
    const voicePool = [];

    function initAudio() {
      if (!isAudioEnabled) return;
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          
          masterFilter = audioCtx.createBiquadFilter();
          masterFilter.type = 'lowpass';
          masterFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);
          masterFilter.connect(audioCtx.destination);

          for (let i = 0; i < MAX_VOICES; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(masterFilter);
            osc.start();

            voicePool.push({ osc, gain });
          }
        }
      }
      if (audioCtx && audioCtx.state === 'suspended' && isAudioEnabled) {
        audioCtx.resume();
      }
    }

    function playPokoSound(pitchRatio = 1.0, isFusion = false) {
      if (!isAudioEnabled || !audioCtx || audioCtx.state !== 'running') return;

      const baseVolume = isFusion ? volFusion : volSpawn;
      if (baseVolume <= 0.01) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const baseFreq = 260 + Math.random() * 200;
        osc.frequency.setValueAtTime(baseFreq * pitchRatio, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.6 * pitchRatio, audioCtx.currentTime + 0.05);

        const targetGain = 0.08 * baseVolume;
        gain.gain.setValueAtTime(targetGain, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);

        osc.connect(gain);
        gain.connect(masterFilter || audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.07);
      } catch (e) {}
    }

    // ==========================================
    // 2. Three.js セットアップ
    // ==========================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d0f18, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    
    // カメラ目標値 (② 画面移動と無限ズーム用)
    let targetZoom = 30;
    let targetCamPos = new THREE.Vector3(0, 0, targetZoom);
    camera.position.set(0, 0, targetZoom);

    // ② カメラリセット処理
    resetCamBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      targetZoom = 30;
      targetCamPos.set(0, 0, targetZoom);
    });

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const mainLight = new THREE.PointLight(0x7ef1d3, 2.5, 200);
    mainLight.position.set(0, 0, 20);
    scene.add(mainLight);

    const raycaster = new THREE.Raycaster();
    const mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const pointer = new THREE.Vector2();
    const intersectPoint = new THREE.Vector3();

    // ==========================================
    // 3. 粒子クラス
    // ==========================================
    const MAX_PARTICLES = 1000;
    const particles = [];

    const baseSphereGeo = new THREE.SphereGeometry(0.28, 12, 12);
    const particleMat = new THREE.MeshPhongMaterial({
      color: 0x7ef1d3,
      emissive: 0x052218,
      shininess: 90,
      transparent: true,
      opacity: 0.85
    });

    class ChibiParticle {
      constructor(x, y, z, initialVel, options = {}) {
        this.mesh = new THREE.Mesh(baseSphereGeo, particleMat.clone());
        this.mesh.position.set(x, y, z);
        
        this.type = options.type !== undefined ? options.type : 0;
        
        const rawRadius = options.radius !== undefined ? options.radius : 0.28;
        this.radius = Math.min(rawRadius, 3.0); 

        this.hue = options.hue !== undefined ? options.hue : (0.40 + Math.random() * 0.18);
        this.attractionPower = options.attractionPower !== undefined ? Math.min(options.attractionPower, 0.05) : 0.007;
        this.lifeBonus = options.lifeBonus !== undefined ? Math.min(options.lifeBonus, 3.0) : 1.0;
        
        this.mesh.scale.setScalar(this.radius / 0.28);
        this.mesh.material.color.setHSL(this.hue % 1.0, 0.8, 0.65);

        this.velocity = initialVel.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.12,
          (Math.random() - 0.5) * 0.12,
          (Math.random() - 0.5) * 0.12
        ));

        this.life = 1.0;
        this.baseDecay = (0.025 + Math.random() * 0.005) / this.lifeBonus;

        this.age = 0;
        this.decomposed = false;
        this.fusionCooldown = options.fusionCooldown !== undefined ? options.fusionCooldown : 30;

        this.baseFreq = (80 + Math.random() * 120) * Math.pow(0.9, Math.min(this.type, 8));
      }

      applyFlockingRule(neighbors, bounds) {
        const cohesion = new THREE.Vector3();
        const separation = new THREE.Vector3();
        const alignment = new THREE.Vector3();
        let count = 0;

        for (let i = 0; i < neighbors.length; i++) {
          const other = neighbors[i];
          const dist = this.mesh.position.distanceTo(other.mesh.position);

          if (dist > 0 && dist < 5.0) {
            cohesion.add(other.mesh.position);
            alignment.add(other.velocity);

            if (dist < (1.1 * (this.radius + other.radius) / 0.56)) {
              const pushAway = new THREE.Vector3().subVectors(this.mesh.position, other.mesh.position);
              pushAway.normalize().divideScalar(Math.max(dist, 0.1));
              separation.add(pushAway);
            }
            count++;
          }
        }

        if (count > 0) {
          cohesion.divideScalar(count);
          const cohesionForce = new THREE.Vector3().subVectors(cohesion, this.mesh.position).multiplyScalar(this.attractionPower);
          this.velocity.add(cohesionForce);

          alignment.divideScalar(count).multiplyScalar(0.035);
          this.velocity.add(alignment);

          separation.multiplyScalar(0.035);
          this.velocity.add(separation);
        }

        // X, Y バウンディング
        if (Math.abs(this.mesh.position.x) > bounds.x) {
          this.velocity.x += -Math.sign(this.mesh.position.x) * 0.015 * (Math.abs(this.mesh.position.x) - bounds.x);
        }
        if (Math.abs(this.mesh.position.y) > bounds.y) {
          this.velocity.y += -Math.sign(this.mesh.position.y) * 0.015 * (Math.abs(this.mesh.position.y) - bounds.y);
        }

        // ① Z軸（手前・奥）の範囲制限（見失わない制限）
        const maxZ = 12.0;
        const minZ = -15.0;
        if (this.mesh.position.z > maxZ) {
          this.velocity.z -= (this.mesh.position.z - maxZ) * 0.02;
        } else if (this.mesh.position.z < minZ) {
          this.velocity.z += (minZ - this.mesh.position.z) * 0.02;
        }
      }

      update(allParticles) {
        this.velocity.multiplyScalar(0.965);
        this.mesh.position.add(this.velocity);
        this.age += 1;

        if (this.fusionCooldown > 0) this.fusionCooldown--;

        // 分解判定 (type > 0)
        if (this.type > 0) {
          let baseDecomposeAge = (200 + this.type * 80) * decayTimeFactor;
          
          if (this.radius > sizeLimitThreshold) {
            const overScale = this.radius / sizeLimitThreshold;
            baseDecomposeAge /= Math.max(1.1, Math.pow(overScale, 2));
          }

          if (this.age > baseDecomposeAge) {
            this.decomposed = true;
            return false;
          }

          this.mesh.material.opacity = 0.9;
          return true; 
        }

        // 初期粒子 (type == 0) の寿命
        let proximitySupport = 0;
        const totalCount = allParticles.length;

        for (let i = 0; i < totalCount; i++) {
          const other = allParticles[i];
          if (other !== this) {
            const dist = this.mesh.position.distanceTo(other.mesh.position);
            const exponentialDist = 1.0 / Math.pow(dist + 0.1, expFactor);
            proximitySupport += exponentialDist * 0.0035;
          }
        }

        let totalSupport = 0;
        if (proximitySupport > thresholdValue) {
          const countSupport = Math.pow(totalCount, 1.1) * 0.00003;
          totalSupport = proximitySupport + countSupport;
        }

        const currentDecay = Math.max(0.0003, this.baseDecay - totalSupport);
        this.life -= currentDecay;
        this.mesh.material.opacity = Math.max(0, this.life * 0.85);

        return this.life > 0;
      }

      destroy() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.mesh.material.dispose();
      }
    }

    // ==========================================
    // 4. ② 操作・無限ズーム・カメラ移動
    // ==========================================
    let isInteracting = false;
    let lastPos = new THREE.Vector3();
    let dragVelocity = new THREE.Vector3();
    let initialPinchDistance = null;

    function getPointerPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;

      mousePlane.constant = -targetCamPos.z + targetZoom;
      raycaster.setFromCamera(pointer, camera);
      raycaster.ray.intersectPlane(mousePlane, intersectPoint);
    }

    function getTouchDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function onPointerDown(e) {
      if (e.target.closest('#ui-container')) return;
      initAudio();

      if (e.touches && e.touches.length === 2) {
        isInteracting = false;
        initialPinchDistance = getTouchDistance(e);
        return;
      }

      isInteracting = true;
      getPointerPos(e);
      lastPos.copy(intersectPoint);
      dragVelocity.set(0, 0, 0);

      spawnCluster(intersectPoint, 4, new THREE.Vector3());
    }

    function onPointerMove(e) {
      // ピンチイン / ピンチアウト (② 無限ズーム ＆ ピンチイン移動)
      if (e.touches && e.touches.length === 2) {
        if (initialPinchDistance) {
          const newDistance = getTouchDistance(e);
          const delta = (initialPinchDistance - newDistance) * (targetZoom * 0.003);
          
          // ② ズーム制限撤廃（無段階でズームアウト可能）
          targetZoom = Math.max(5, targetZoom + delta * 2.0);
          
          // タップ中心への吸い込み補正
          getPointerPos(e);
          targetCamPos.x += (intersectPoint.x - targetCamPos.x) * 0.02;
          targetCamPos.y += (intersectPoint.y - targetCamPos.y) * 0.02;

          initialPinchDistance = newDistance;
        }
        return;
      }

      if (!isInteracting) return;
      getPointerPos(e);

      dragVelocity.subVectors(intersectPoint, lastPos);

      if (dragVelocity.lengthSq() > 0.04) {
        const count = Math.min(Math.floor(dragVelocity.length() * 4) + 1, 5);
        spawnCluster(intersectPoint, count, dragVelocity.clone().multiplyScalar(0.3));
        lastPos.copy(intersectPoint);
      }
    }

    function onPointerUp(e) {
      if (e.touches && e.touches.length < 2) {
        initialPinchDistance = null;
      }
      if (!e.touches || e.touches.length === 0) {
        isInteracting = false;
      }
    }

    // マウスホイールでのズームイン・ズームアウト
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('#ui-container')) return;
      initAudio();

      getPointerPos(e);
      const zoomFactor = e.deltaY * 0.002 * targetZoom;
      targetZoom = Math.max(5, targetZoom + zoomFactor);

      // ズームイン時にカーソルのある場所へ視点を寄せる
      if (e.deltaY < 0) {
        targetCamPos.x += (intersectPoint.x - targetCamPos.x) * 0.1;
        targetCamPos.y += (intersectPoint.y - targetCamPos.y) * 0.1;
      }
    }, { passive: true });

    function spawnCluster(pos, count, impulse, options = {}) {
      for (let i = 0; i < count; i++) {
        if (particles.length >= MAX_PARTICLES) {
          const oldest = particles.shift();
          oldest.destroy();
        }

        const offset = new THREE.Vector3(
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 0.8
        );
        const spawnPos = pos.clone().add(offset);
        const p = new ChibiParticle(spawnPos.x, spawnPos.y, spawnPos.z, impulse, options);

        scene.add(p.mesh);
        particles.push(p);
      }
      
      const speedPitch = 0.85 + Math.min(impulse.length() * 1.2, 0.7);
      playPokoSound(speedPitch, false);
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#ui-container')) return;
      initAudio();
      if (e.touches.length === 2) initialPinchDistance = getTouchDistance(e);
    }, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 5. 衝突・融合ロジック
    // ==========================================
    function handleCollisionsAndFusion() {
      if (reactivityFactor <= 0.01) return;

      const requiredSpeed = 0.8 / reactivityFactor; 

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        if (!p1 || p1.life <= 0 || p1.fusionCooldown > 0) continue;

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          if (!p2 || p2.life <= 0 || p2.fusionCooldown > 0) continue;

          const dist = p1.mesh.position.distanceTo(p2.mesh.position);
          const minDist = (p1.radius + p2.radius) * 0.8; 

          if (dist < minDist) {
            const relVel = new THREE.Vector3().subVectors(p1.velocity, p2.velocity);
            const relativeSpeed = relVel.length();

            if (relativeSpeed > requiredSpeed) {
              p1.life = 0;
              p2.life = 0;

              const newType = Math.max(p1.type, p2.type) + 1;
              const maxLifeBonus = Math.min(Math.max(p1.lifeBonus, p2.lifeBonus) * 1.15, 2.5);
              const maxRadius = Math.min(Math.max(p1.radius, p2.radius) * 1.1, 2.5);
              const maxAttraction = Math.min(Math.max(p1.attractionPower, p2.attractionPower) * 1.2, 0.04);

              const latestHue = (p1.type >= p2.type) ? p1.hue : p2.hue;
              const newHue = latestHue + 0.05;

              const fusionPos = new THREE.Vector3().addVectors(p1.mesh.position, p2.mesh.position).multiplyScalar(0.5);
              const fusionVel = new THREE.Vector3().addVectors(p1.velocity, p2.velocity).multiplyScalar(0.5);

              playPokoSound(1.2 + Math.min(newType, 10) * 0.1, true);

              spawnCluster(fusionPos, 1, fusionVel, {
                type: newType,
                radius: maxRadius,
                hue: newHue,
                attractionPower: maxAttraction,
                lifeBonus: maxLifeBonus,
                fusionCooldown: 30
              });

              break;
            }
          }
        }
      }
    }

    // ③ 動的移動音量更新 (Motion Sound Control)
    function updateAudioVoices() {
      if (!isAudioEnabled || !audioCtx || audioCtx.state !== 'running') return;

      const activeParticles = particles
        .slice()
        .sort((a, b) => b.velocity.lengthSq() - a.velocity.lengthSq())
        .slice(0, MAX_VOICES);

      for (let i = 0; i < MAX_VOICES; i++) {
        const voice = voicePool[i];
        const p = activeParticles[i];

        if (p && p.life > 0 && volMotion > 0.01) {
          const speed = p.velocity.length();
          const targetFreq = p.baseFreq + (speed * 300);
          const targetVol = Math.min(0.0003 + (speed * 0.005), 0.003) * Math.max(0, p.life) * volMotion;

          voice.osc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
          voice.gain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.08);
        } else {
          voice.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
        }
      }
    }

    // ==========================================
    // 6. メインフレーム描画
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      // ② カメラ位置のスムース更新
      targetCamPos.z = targetZoom;
      camera.position.lerp(targetCamPos, 0.08);

      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const bounds = { x: (visibleWidth / 2) * 0.85, y: (visibleHeight / 2) * 0.85 };

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const neighbors = [];
        for (let j = 0; j < particles.length; j += 2) { 
          if (i !== j) neighbors.push(particles[j]);
        }
        p.applyFlockingRule(neighbors, bounds);
      }

      handleCollisionsAndFusion();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const alive = p.update(particles);

        if (p.decomposed) {
          const parentPos = p.mesh.position.clone();
          const parentVel = p.velocity.clone();
          const prevType = p.type - 1;

          p.destroy();
          particles.splice(i, 1);

          playPokoSound(0.9 + prevType * 0.1, true);

          spawnCluster(parentPos, 2, parentVel.negate().multiplyScalar(0.25), {
            type: prevType,
            radius: Math.max(0.28, p.radius / 1.12),
            hue: p.hue,
            attractionPower: Math.max(0.007, p.attractionPower / 1.2),
            lifeBonus: Math.max(1.0, p.lifeBonus / 1.15),
            fusionCooldown: 40
          });
          continue;
        }

        if (!alive) {
          p.destroy();
          particles.splice(i, 1);
        }
      }

      updateAudioVoices();

      if (particles.length > 0) {
        const avgPos = new THREE.Vector3();
        for (let i = 0; i < particles.length; i++) {
          avgPos.add(particles[i].mesh.position);
        }
        avgPos.divideScalar(particles.length);
        mainLight.position.lerp(avgPos, 0.05);
        mainLight.position.z = camera.position.z * 0.6;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
